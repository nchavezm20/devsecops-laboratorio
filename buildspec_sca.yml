version: 0.2

phases:
  install:
    commands:
      - echo "Descargando OWASP Dependency-Check..."
      - curl -sSLo /tmp/dc.zip https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.4/dependency-check-10.0.4-release.zip
      - unzip -q /tmp/dc.zip -d /opt
      - export PATH="/opt/dependency-check/bin:$PATH"
      - mkdir -p reports .dependency-check
      - echo "Obteniendo NVD_API_KEY desde Parameter Store"
      - export NVD_API_KEY=$(aws ssm get-parameter --name NVD_API_KEY --with-decryption --query "Parameter.Value" --output text)

  build:
    commands:
      - echo "Ejecutando análisis SCA con OWASP Dependency-Check (sin CISA KEV)"
      - |
        dependency-check.sh \
          --scan . \
          --format "HTML" \
          --out reports \
          --data .dependency-check \
          --nvdApiKey $NVD_API_KEY \
          --disableKnownExploited \
          --failOnCVSS 4.0 || true

      - echo "⚠️ Si hubo error o vulnerabilidades críticas, el pipeline continuará (control registrado)."
      - ls -l reports || true

  post_build:
    commands:
      - echo "✅ Análisis SCA finalizado. Generando evidencia..."
      - touch SCA_COMPLETED

artifacts:
  files:
    - "reports/**/*"
    - SCA_COMPLETED
  discard-paths: no

cache:
  paths:
    - ".dependency-check/**"
