version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "devsecops-laboratorio"
    IMAGE_TAG: "latest"
    AWS_REGION: "us-east-1"

phases:
  install:
    commands:
      - echo "🔧 Instalando dependencias necesarias..."
      - yum update -y
      - yum install -y docker jq tar --allowerasing
      - echo "✅ Dependencias instaladas."

  pre_build:
    commands:
      - echo "🔐 Iniciando sesión en Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 091512052243.dkr.ecr.$AWS_REGION.amazonaws.com

  build:
    commands:
      - echo "🧱 Construyendo imagen Docker..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG 091512052243.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

      - echo "🔍 Instalando Trivy correctamente..."
      - mkdir -p ./bin
      - curl -sL https://github.com/aquasecurity/trivy/releases/download/v0.52.2/trivy_0.52.2_Linux-64bit.tar.gz -o trivy.tar.gz
      - tar zxvf trivy.tar.gz -C ./bin
      - chmod +x ./bin/trivy
      - export PATH=$PATH:$(pwd)/bin
      - ./bin/trivy --version

      - echo "🚀 Ejecutando escaneo con Trivy..."
      - trivy image --exit-code 0 --severity MEDIUM,HIGH,CRITICAL --format table $IMAGE_REPO_NAME:$IMAGE_TAG > trivy-report.txt
      - trivy image --exit-code 0 --severity MEDIUM,HIGH,CRITICAL --format json $IMAGE_REPO_NAME:$IMAGE_TAG > trivy-report.json

      - echo "📊 Analizando resultados..."
      - |
        CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
        HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json)
        MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-report.json)
        TOTAL=$((CRITICAL + HIGH + MEDIUM))
        echo "Resumen de vulnerabilidades detectadas:"
        echo "  CRITICAL: $CRITICAL"
        echo "  HIGH: $HIGH"
        echo "  MEDIUM: $MEDIUM"
        echo "  TOTAL: $TOTAL"
        if [ "$TOTAL" -gt 0 ]; then
          echo "❌ Vulnerabilidades MEDIUM+ detectadas. Fallando pipeline."
          exit 1
        else
          echo "✅ Imagen sin vulnerabilidades MEDIUM, HIGH ni CRITICAL."
        fi

  post_build:
    commands:
      - echo "📦 Subiendo imagen a Amazon ECR..."
      - docker push 091512052243.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "✅ Imagen subida exitosamente."
      - touch DOCKER_COMPLETED

artifacts:
  files:
    - trivy-report.txt
    - trivy-report.json
    - DOCKER_COMPLETED
  discard-paths: no
