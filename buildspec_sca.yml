version: 0.2

phases:
  install:
    commands:
      - echo "Instalando Snyk CLI..."
      - curl -sL https://snyk.io/install.sh | bash
      - echo "Obteniendo token SNYK desde Parameter Store"
      - export SNYK_TOKEN=$(aws ssm get-parameter --name SNYK_TOKEN --with-decryption --query "Parameter.Value" --output text)
      - snyk auth $SNYK_TOKEN

  build:
    commands:
      - echo "Ejecutando análisis SCA real con Snyk..."
      # Ejecuta el escaneo y muestra solo vulnerabilidades de severidad media o superior
      - snyk test --severity-threshold=medium || true
      - echo "⚠️ Si se detectan vulnerabilidades, el pipeline continuará (control registrado)."

  post_build:
    commands:
      - echo "✅ Control SCA (Snyk) finalizado."
      - snyk version > reports/snyk-version.txt
      - echo "Resultado registrado en logs de CodeBuild."
      - touch SCA_COMPLETED

artifacts:
  files:
    - reports/snyk-version.txt
    - SCA_COMPLETED
  discard-paths: no
