version: 0.2

phases:
  install:
    commands:
      - echo "📦 Simulando instalación de OWASP Dependency-Check (modo resumen rápido)"
      - mkdir -p reports

  build:
    commands:
      - echo "🚀 Ejecutando análisis SCA simulado..."
      - echo "Analizando dependencias del proyecto..."
      - sleep 5
      # Simula un resultado con vulnerabilidades
      - |
        VULN_COUNT=$(shuf -i 0-5 -n 1)
        echo "🔎 Se detectaron $VULN_COUNT vulnerabilidades (simulado)"
        if [ "$VULN_COUNT" -gt 0 ]; then
          echo "❌ Se encontraron vulnerabilidades Medium o superiores. (Control SCA FALLIDO)"
          RESULT="FAILED"
        else
          echo "✅ No se detectaron vulnerabilidades críticas ni medias. (Control SCA EXITOSO)"
          RESULT="PASSED"
        fi
        echo "Resultado del control SCA: $RESULT" | tee reports/sca-summary.log

  post_build:
    commands:
      - echo "📄 Guardando evidencia del control SCA..."
      - cat reports/sca-summary.log
      - touch SCA_COMPLETED

artifacts:
  files:
    - "reports/**/*"
    - SCA_COMPLETED
  discard-paths: no
